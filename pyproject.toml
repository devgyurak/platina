[project]
name = "platina"
version = "0.0.0"
description = "An ORM whose domain code never touches the database: declared loads, pure use cases, changes as data."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 1 - Planning",
    "Framework :: AnyIO",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
# Runtime dependencies are added with the first code that needs them (design doc section 8.6):
# psycopg with its pool for platina.drivers.psycopg (ADR-0012); anyio comes with the runners.
# No libpq is bundled: users install `psycopg[binary]` or a system libpq (ADR-0012).
dependencies = ["psycopg[pool]>=3.3"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "hypothesis>=6.170",
    "ruff>=0.17",
    "pyright>=1.1.400",
    "mypy>=1.18",
    "import-linter>=2.17",
    "pyyaml>=6.0",
    # <0.11: tools/freethreaded.py reads the parallel_threads(1) marker this version adds to the
    # tests it runs on one thread; check that before allowing a newer version.
    "pytest-run-parallel>=0.10,<0.11",
]
# libpq for development and CI (ADR-0012). Its own group, not `dev`: psycopg-binary has no
# free-threaded wheel, so `make test-unit-ft` installs the defaults with `--no-group binary`.
binary = ["psycopg[binary]>=3.3"]
# Experiments of design doc section 9 (`uv sync --group spike`): the Alembic round trip needs the
# schema tooling. psycopg comes with the runtime dependency and the `binary` group.
spike = [
    "sqlalchemy>=2.0",
    "alembic>=1.16",
]

[tool.uv]
default-groups = ["dev", "binary"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "platina"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
# Markdown is excluded: ruff would reformat the code samples in the docs (design sketches).
extend-exclude = [".claude", ".codex", ".pi", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "TID", "T20"]
ignore = [
    "RUF001", # test data intentionally contains non-ASCII strings
    "E501",   # ruff format owns line length; what remains is unbreakable strings
]

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["T20"]
"spikes/**" = ["T20"]

# --------------------------------------------------------------------------- types
# `make typecheck`: pyright (strict on src) + mypy --strict on src. `make test-types`:
# tools/typetests.py runs tests/typing/pass_*/fail_* through both checkers.
# tests/typing is deliberately NOT in `include` (its fail_* lines are meant to error) and must
# NOT be in `exclude` either: pyright ignores excluded files even when they are passed on the
# command line, which would silently disable the type tests. Files outside `include` are still
# checked when passed explicitly, with the `strict` setting of their path.
[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tools", "tests/unit", "tests/support", "tests/integration"]
strict = ["src", "tests/typing", "spikes"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["platina"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tests/typing", "tests/support"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: needs a real PostgreSQL (the first tests/integration conftest applies it)",
]
# tools/freethreaded.py (make test-unit-ft) relies on exactly ["error"]: it refuses to run otherwise.
filterwarnings = ["error"]

# --------------------------------------------------------------------------- import-linter
# Internal layering (design doc section 10.4): imports point from the shell down to the core.
# `|` separates independent siblings. External modules per zone are tools/guards/archlint.py.
[tool.importlinter]
root_package = "platina"

# `exhaustive`: every direct child of `platina` must be listed, so a new package cannot slip in
# without a placement decision. `app` (App, seal orchestration): ADR-0001.
[[tool.importlinter.contracts]]
name = "platina layers: shell -> core only"
type = "layers"
containers = ["platina"]
exhaustive = true
layers = [
    "cli | integrations | testing",
    "app",
    "runners | outbox | migrate | codegen",
    "drivers",
    "sql",
    "core",
]
